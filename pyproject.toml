[tool.poetry]
name = "triage"
version = "0.1.0"
description = "Triagem automática de laudos médicos com NLP, servida via FastAPI"
authors = ["Alan Fanti"]
readme = "README.md"
packages = [{ include = "triage", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
scikit-learn = "^1.5"
pandas = "^2.2"
numpy = "^1.26"
scipy = "^1.13"
joblib = "^1.4"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.8"
pydantic-settings = "^2.4"
prometheus-client = "^0.20"
skl2onnx = "^1.17"
onnxruntime = ">=1.19,<1.24"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
httpx = "^0.27"
ruff = "^0.6"
pre-commit = "^3.8"
ipykernel = "^6.29"
notebook = "^7.2"
matplotlib = "^3.9"
seaborn = "^0.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # Library-internal deprecation: starlette 0.46.2's testclient module
    # references the anyio.abc.BlockingPortal alias at import time, which
    # anyio 4.15's lazy-import shim flags as deprecated (anyio/_lazyimport.py),
    # but attributes to the starlette.testclient frame via stacklevel. This
    # fires the moment anything imports fastapi.testclient/starlette.testclient
    # (tests/api does, to exercise lifespan via `with TestClient(...)`).
    # No caller-side fix at fastapi's pinned starlette range (<0.47); narrowly
    # scoped to this exact message/module so other DeprecationWarnings still
    # fail loudly.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]
