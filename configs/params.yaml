data:
  train_file: medical_tc_train.csv
  test_file: medical_tc_test.csv
  labels_file: medical_tc_labels.csv
  val_size: 0.2

features:
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.9
  sublinear_tf: true
  max_features: 50000

model:
  name: logistic_regression
  C: 1.0
  max_iter: 1000
  class_weight: balanced

evaluation:
  min_macro_f1: 0.55
